version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"   # LOCALHOST : CONTAINER
    volumes:
      - ./backend:/app
      - /app/__pycache__
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:  # means Start the Redis service before starting the backend service.
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
